<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Box Creator</title>
  <meta name="description" content="3D プリント用の蓋付き箱の STL をブラウザだけで生成します">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="layout">
    <aside class="panel">
      <header class="title">
        <h1>Box Creator</h1>
        <p>カチッと閉まる蓋付きの箱を、寸法から STL にします。単位はすべて mm です。</p>
      </header>

      <form id="form" autocomplete="off" novalidate>
        <section class="group">
          <h2>箱の形状と内寸</h2>
          <div class="segmented" role="radiogroup" aria-label="箱の形状">
            <label><input type="radio" name="shape" value="rect" checked><span>四角</span></label>
            <label><input type="radio" name="shape" value="cyl"><span>円筒</span></label>
          </div>
          <div class="fields" data-show="shape=rect">
            <div class="field" data-field="w"><label for="f-w">内寸 幅 W</label><input id="f-w" name="w" type="number" step="0.1" value="61.6"></div>
            <div class="field" data-field="d"><label for="f-d">内寸 奥行き D</label><input id="f-d" name="d" type="number" step="0.1" value="49.6"></div>
          </div>
          <div class="fields" data-show="shape=cyl">
            <div class="field" data-field="dia"><label for="f-dia">内径</label><input id="f-dia" name="dia" type="number" step="0.1" value="51.6"></div>
          </div>
          <div class="fields">
            <div class="field" data-field="h"><label for="f-h">内寸 高さ H</label><input id="f-h" name="h" type="number" step="0.5" value="96"></div>
          </div>
          <p class="hint" data-show="content=hollow">内寸は下箱の中の寸法です。高さは床の上面から蓋の天井までです。</p>
          <p class="hint" data-show="content=holes">内寸は蓋の中の寸法です。高さは床の上面から蓋の天井までです。</p>
        </section>

        <section class="group">
          <h2>高さの分け方</h2>
          <div class="segmented" role="radiogroup" aria-label="高さの分け方">
            <label><input type="radio" name="split" value="lid" checked><span>蓋の高さで指定</span></label>
            <label><input type="radio" name="split" value="base"><span>下箱の高さで指定</span></label>
          </div>
          <div class="fields">
            <div class="field" data-field="split_h"><label for="f-split" id="split-label">蓋の高さ</label><input id="f-split" name="split_h" type="number" step="0.5" value="33"></div>
          </div>
          <p class="hint">下箱の高さは、外から見える高さ（段の肩まで）です。</p>
        </section>

        <section class="group">
          <h2>中身</h2>
          <div class="segmented" role="radiogroup" aria-label="中身のタイプ">
            <label><input type="radio" name="content" value="hollow" checked><span>空洞</span></label>
            <label><input type="radio" name="content" value="holes"><span>円筒を立てる穴</span></label>
          </div>
          <div class="fields" data-show="content=holes">
            <div class="field" data-field="hole_d"><label for="f-hd">円筒の直径</label><input id="f-hd" name="hole_d" type="number" step="0.5" value="16"></div>
            <div class="field" data-field="hole_n"><label for="f-hn">個数</label><input id="f-hn" name="hole_n" type="number" step="1" min="1" value="2"></div>
            <div class="field" data-field="hole_depth"><label for="f-hdp">穴の深さ</label><input id="f-hdp" name="hole_depth" type="number" step="0.5" value="20"></div>
          </div>
        </section>

        <details class="group" id="advanced">
          <summary>詳細設定</summary>
          <div class="fields" id="advanced-fields"></div>
          <button type="button" class="link" id="reset-advanced">初期値に戻す</button>
        </details>
      </form>

      <section class="group" id="summary-group">
        <h2>寸法の確認</h2>
        <dl id="summary"></dl>
        <ul id="warnings" class="warnings"></ul>
      </section>

      <section class="downloads">
        <div class="download-row">
          <button type="button" data-download="base" disabled>下箱 STL</button>
          <button type="button" data-download="lid" disabled>蓋 STL</button>
        </div>
        <button type="button" data-download="ring" disabled>はめ具合テスト用リング STL</button>
        <button type="button" class="primary" data-download="zip" disabled>まとめて ZIP でダウンロード</button>
      </section>
    </aside>

    <section class="stage">
      <div class="viewer" id="viewer" aria-label="箱のプレビュー">
        <div class="overlay" id="overlay" hidden></div>
      </div>
      <div class="toolbar">
        <div class="segmented" role="radiogroup" aria-label="表示">
          <label><input type="radio" name="view" value="exploded" checked><span>分解</span></label>
          <label><input type="radio" name="view" value="assembled"><span>組み立て</span></label>
        </div>
        <label class="check"><input type="checkbox" id="section"> 断面</label>
        <input type="range" id="section-pos" min="-1" max="1" step="0.01" value="0" aria-label="断面の位置" disabled>
        <button type="button" class="link" id="reset-view">視点を戻す</button>
        <span class="status" id="status" role="status">読み込み中…</span>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
